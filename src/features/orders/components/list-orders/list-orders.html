@if (loading()) {
  <div
    class="w-5xl mx-auto bg-white border border-gray-200 shadow-sm rounded-lg p-6 animate-pulse"
  >
    <div class="h-6 w-40 skeleton mb-6"></div>
    <div class="flex gap-2 mb-4">
      <div class="skeleton h-10 w-full rounded"></div>
      <div class="skeleton h-10 w-24 rounded"></div>
      <div class="skeleton h-10 w-24 rounded"></div>
    </div>
    <div class="skeleton h-4 w-64 mb-6"></div>
    <div
      class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100 mb-6"
    >
      <table class="table w-full">
        <thead>
          <tr>
            <th><div class="skeleton h-4 w-10"></div></th>
            <th><div class="skeleton h-4 w-32"></div></th>
            <th><div class="skeleton h-4 w-24"></div></th>
            <th><div class="skeleton h-4 w-16"></div></th>
            <th><div class="skeleton h-4 w-20"></div></th>
            <th><div class="skeleton h-4 w-20"></div></th>
          </tr>
        </thead>
        <tbody>
          @for (item of "12345678"; track $index) {
            <tr>
              <td><div class="skeleton h-4 w-10"></div></td>
              <td><div class="skeleton h-4 w-32"></div></td>
              <td><div class="skeleton h-4 w-24"></div></td>
              <td><div class="skeleton h-4 w-16"></div></td>
              <td><div class="skeleton h-4 w-20"></div></td>
              <td>
                <div class="flex gap-2">
                  <div class="skeleton h-8 w-8 rounded"></div>
                  <div class="skeleton h-8 w-8 rounded"></div>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="flex justify-center mt-6 gap-2">
      <div class="skeleton h-8 w-8 rounded"></div>
      <div class="skeleton h-8 w-8 rounded"></div>
      <div class="skeleton h-8 w-8 rounded"></div>
      <div class="skeleton h-8 w-8 rounded"></div>
      <div class="skeleton h-8 w-8 rounded"></div>
    </div>
  </div>
} @else {
  <div
    class="w-5xl mx-auto bg-white border border-gray-200 shadow-sm rounded-lg p-6"
  >
    <div class="flex flex-col gap-4 mb-6">
      <h2 class="text-lg font-bold">Lista de Órdenes</h2>

      <app-orders-search
        [searchForm]="searchForm"
        (clearSearch)="onClearSearch()"
        (downloadReportCsv)="onDownloadReportCsv()"
      ></app-orders-search>

      @if (hasTriedLoad()) {
        <div class="text-sm text-gray-600">
          Mostrando {{ (currentPage - 1) * pageSize + 1 }} -
          {{ math.min(currentPage * pageSize, totalItems) }} de
          {{ totalItems }} pedidos
        </div>
      }
    </div>

    <app-orders-table
      [orders]="orders"
      [hasTriedLoad]="hasTriedLoad()"
      [errorMessage]="errorMessage()"
      (editOrder)="onEditOrder($event)"
      (generatePdf)="onGeneratePdf($event)"
    ></app-orders-table>

    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      (goToPage)="onGoToPage($event)"
      (previousPage)="onPreviousPage()"
      (nextPage)="onNextPage()"
    ></app-pagination>
  </div>
}
